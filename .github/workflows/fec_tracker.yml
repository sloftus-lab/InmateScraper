name: FEC Tracker

on:
  workflow_dispatch:        # triggered by cron-job.org every hour, or manually via GitHub UI

permissions:
  contents: write           # needed to commit updated state file

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FEC tracker
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FEC_STATE: ME
          FEC_SENATE_CYCLE: 2026
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python fec_tracker.py

      - name: Commit and push updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fec_state.json
          git diff --staged --quiet || git commit -m "fec-tracker: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
