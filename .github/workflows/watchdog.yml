name: Scraper Watchdog

on:
  schedule:
    # Once an hour, offset to :23 -- avoids the top-of-hour (:00) congestion
    # spike that scrape.yml's own schedule fires on. Scrapes gaps became
    # dramatically worse right after this workflow was added running every
    # 30 min at :00/:30, so this also halves its added scheduled-job volume.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check last successful scrape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INMATE_EMAIL_FROM: ${{ secrets.INMATE_EMAIL_FROM }}
          INMATE_EMAIL_PASSWORD: ${{ secrets.INMATE_EMAIL_PASSWORD }}
          INMATE_EMAIL_TO: ${{ secrets.INMATE_EMAIL_TO }}
        run: python watchdog.py
