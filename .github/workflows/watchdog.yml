name: Scraper Watchdog

on:
  schedule:
    - cron: "*/30 * * * *"   # check twice an hour that the hourly scrape is actually landing
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check last successful scrape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INMATE_EMAIL_FROM: ${{ secrets.INMATE_EMAIL_FROM }}
          INMATE_EMAIL_PASSWORD: ${{ secrets.INMATE_EMAIL_PASSWORD }}
          INMATE_EMAIL_TO: ${{ secrets.INMATE_EMAIL_TO }}
        run: python watchdog.py
